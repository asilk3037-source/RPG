<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapas Antigos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --red: #b3150f; --brown: #6b5a4a; --dark: #4a3a2b; --line: #e3ded6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: "Source Sans Pro", system-ui, sans-serif; font-size: 14px; color: #222; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header { height: 40px; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: #fff; border-bottom: 2px solid var(--brown); flex: none; }
  .logo { font-weight: 700; color: var(--red); font-size: 1.1rem; white-space: nowrap; }
  .search { display: flex; width: 280px; border: 1px solid var(--line); }
  .search button { background: var(--red); color: #fff; border: 0; width: 28px; cursor: pointer; }
  .search input { flex: 1; border: 0; padding: 4px 8px; font: inherit; outline: none; min-width: 0; }
  nav a { margin-right: 18px; color: #222; text-decoration: none; }
  .spacer { flex: 1; }
  .btn-red { background: var(--red); color: #fff; border: 0; padding: 6px 14px; border-radius: 2px; cursor: pointer; font: inherit; }

  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; }
  #map { height: 100%; background: #eee; }

  #panel { width: 245px; flex: none; display: flex; flex-direction: column; background: #fff; border-left: 1px solid var(--line); }
  .ph { background: var(--brown); color: #fff; padding: 10px 12px; font-weight: 600; }
  .tabs { display: flex; gap: 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .tabs span { cursor: default; padding-bottom: 2px; }
  .tabs .on { border-bottom: 2px solid var(--red); }
  #list { flex: 1; overflow: auto; margin: 0; padding: 0; list-style: none; }
  #list li { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #list li:hover { background: #faf6f0; }
  #list li.on { background: var(--red); color: #fff; }
  #list .t { font-weight: 600; }
  #list .m { font-size: .8rem; opacity: .85; margin-top: 2px; }
  #list .ctl { margin-top: 8px; display: none; }
  #list li.on .ctl { display: block; }
  #list .ctl label { display: block; font-size: .78rem; margin: 4px 0 2px; }
  #list .ctl input[type=range] { width: 100%; }

  .yearbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 500; background: rgba(255,255,255,.95);
    padding: 8px 14px; border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: flex; align-items: center; gap: 10px; width: min(420px, 80%); }
  .yearbar b { background: var(--red); color: #fff; padding: 2px 10px; border-radius: 12px; }
  .yearbar input { flex: 1; }
  .attr { font-size: .72rem; color: #666; padding: 8px 12px; border-top: 1px solid var(--line); }

  @media (max-width: 760px) {
    nav, .btn-red { display: none; }
    main { flex-direction: column; }
    #panel { width: auto; height: 40%; border-left: 0; border-top: 1px solid var(--line); }
  }
.back{color:#194d42;text-decoration:none;font-weight:600;white-space:nowrap}header{height:auto;min-height:48px;flex-wrap:wrap;gap:12px;padding:10px 16px}@media(max-width:760px){.search{width:100%;order:3}.spacer{display:none}.back{margin-left:auto}#mapwrap{min-height:250px}.yearbar{bottom:24px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">Mapas Antigos</span>
    <form class="search" id="sform"><button type="submit" aria-label="Buscar">&#128269;</button>
      <input id="q" type="search" aria-label="Pesquisar local" placeholder="Pesquisar local..."></form>
    <a class="back" href="index.html">← Voltar ao catálogo</a>
    <span class="spacer"></span>
    
  </header>
  <main>
    <div id="mapwrap">
      <div id="map"></div><label id="compare" hidden style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;background:white;padding:8px 12px;border-radius:5px">Histórico ↔ Atual <input id="split" type="range" min="5" max="95" value="50" aria-label="Divisão histórico e atual"></label>
      <div class="yearbar"><b id="yrlbl"></b><input id="yr" type="range" min="0" max="0" step="1" value="0" aria-label="Ano"></div>
    </div>
    <aside id="panel">
      <div class="ph">Mapas históricos da Grã-Bretanha</div>
      <div class="tabs"><span class="on">Camadas disponíveis</span></div>
      <p id="search-status" role="status" style="margin:8px 12px;font-size:12px">As camadas históricas cobrem a Grã-Bretanha. Requer internet.</p><ul id="list"></ul>
      <p class="attr">Mapas históricos: © National Library of Scotland (CC-BY). Base: © OpenStreetMap.</p>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Camadas verificadas (HTTP 200). Para adicionar outras, inclua mais entradas aqui.
  const NLS = 'https://mapseries-tilesets.s3.amazonaws.com/';
  const LAYERS = [
    { id: 'bart40', year: 1940, title: 'Grã-Bretanha, anos 1940', publisher: 'Bartholomew', scale: '1:253 440',
      url: NLS + 'bartholomew/great_britain_1940s/{z}/{x}/{y}.png', maxNativeZoom: 15 },
    { id: 'ten55', year: 1955, title: 'Geral, 10 milhas', publisher: 'Ordnance Survey', scale: '1:633 600',
      url: NLS + 'ten_mile/general/{z}/{x}/{y}.png', maxNativeZoom: 9 },
  ];
  const byYear = [...LAYERS].sort((a, b) => a.year - b.year);

  const start = parseHash() || { lat: 54.4466, lng: -1.26962, z: 14, layer: LAYERS[0].id };
  const map = L.map('map', { zoomControl: false }).setView([start.lat, start.lng], start.z);
  L.control.zoom({ position: 'topleft' }).addTo(map);
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

  const list = document.getElementById('list');
  const yr = document.getElementById('yr'), yrlbl = document.getElementById('yrlbl');
  yr.max = byYear.length - 1;
  let current = start.layer, hist, sbs, opacity = 1, curtain = false;

  function renderList() {
    list.innerHTML = '';
    byYear.forEach(l => {
      const li = document.createElement('li');
      li.className = l.id === current ? 'on' : '';
      li.innerHTML = `<div class="t">${l.title}</div>
        <div class="m">${l.year} | ${l.publisher}</div><div class="m">${l.scale}</div>
        <div class="ctl"><label>Opacidade</label><input type="range" min="0" max="1" step="0.05" value="${opacity}">
          <label><input type="checkbox" ${curtain ? 'checked' : ''}> Cortina: histórico × atual</label></div>`;
      li.onclick = () => { if (current !== l.id) select(l.id); };
      const ctl = li.querySelector('.ctl');
      ctl.onclick = e => e.stopPropagation();
      ctl.querySelector('input[type=range]').oninput = e => { opacity = +e.target.value; hist.setOpacity(opacity); };
      ctl.querySelector('input[type=checkbox]').onchange = e => { curtain = e.target.checked; applyCurtain(); };
      list.appendChild(li);
    });
  }

  function applyCurtain() {
    document.getElementById('compare').hidden = !curtain;
    if (!hist || !hist.getContainer()) return;
    const a = map.containerPointToLayerPoint([0,0]);
    const b = map.containerPointToLayerPoint([map.getSize().x * document.getElementById('split').value / 100, map.getSize().y]);
    hist.getContainer().style.clip = curtain ? `rect(${a.y}px, ${b.x}px, ${b.y}px, ${a.x}px)` : '';
  }

  function select(id) {
    current = id;
    const l = LAYERS.find(x => x.id === id);
    if (hist) map.removeLayer(hist);
    if (sbs) { sbs.remove(); sbs = null; }
    hist = L.tileLayer(l.url, { maxZoom: 19, maxNativeZoom: l.maxNativeZoom, opacity,
      attribution: '© National Library of Scotland' }).addTo(map);
    applyCurtain();
    const i = byYear.findIndex(x => x.id === id);
    yr.value = i; yrlbl.textContent = l.year;
    renderList();
    writeHash();
  }
  yr.oninput = () => select(byYear[+yr.value].id);

  document.getElementById('sform').onsubmit = async e => {
    e.preventDefault();
    const q = document.getElementById('q').value;
    if (!q) return;
    const status = document.getElementById('search-status');
    status.textContent = 'Buscando local…';
    try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('Busca indisponível');
    const j = await r.json();
    if (j[0]) { map.setView([+j[0].lat, +j[0].lon], 14); status.textContent = j[0].display_name; }
    else status.textContent = 'Local não encontrado. Tente outro nome.';
    } catch { status.textContent = 'Não foi possível pesquisar agora. Tente novamente em instantes.'; }
  };

  function writeHash() {
    const c = map.getCenter();
    history.replaceState(null, '', `#position=${map.getZoom()}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}&layer=${current}`);
  }
  function parseHash() {
    const m = location.hash.match(/position=(\d+)\/([-\d.]+)\/([-\d.]+)(?:&layer=(\w+))?/);
    if (!m) return null;
    const layer = LAYERS.some(l => l.id === m[4]) ? m[4] : LAYERS[0].id;
    return { z: +m[1], lat: +m[2], lng: +m[3], layer };
  }
  document.getElementById('split').oninput = applyCurtain;
  map.on('move zoom resize', applyCurtain);
  map.on('moveend', writeHash);
  select(current);
</script>
</body>
</html>
